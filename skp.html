    <!-- 2行目からjava -->
<a href="#top" class="pageup-btn">▲</a>
<script>
// 前回のスクロール位置を記録する変数
let lastScroll = 0;

// スクロールしたときに動く処理
window.addEventListener("scroll", function() {
    let currentScroll = window.pageYOffset;

    if (currentScroll > lastScroll) {
        // 下スクロール → ヘッダーを隠す
        document.getElementById("headerLeft").classList.add("hide");
        document.getElementById("headerRight").classList.add("hide");
    } else {
        // 上スクロール → ヘッダーを表示
        document.getElementById("headerLeft").classList.remove("hide");
        document.getElementById("headerRight").classList.remove("hide");
    }

    lastScroll = currentScroll;
});

// ▼ フルスクリーンメニューの処理
document.getElementById("menuBtn").addEventListener("click", function() {
    const menu = document.getElementById("navMenu");
    const overlay = document.getElementById("menuOverlay");
    const btn = document.getElementById("menuBtn");

    const isOpen = menu.style.display === "block";

    if (isOpen) {
        menu.style.display = "none";
        overlay.style.display = "none";
        btn.textContent = "≡";
    } else {
        menu.style.display = "block";
        overlay.style.display = "block";
        btn.textContent = "×";
    }
});

// ▼ 背景を押したら閉じる
document.getElementById("menuOverlay").addEventListener("click", function() {
    document.getElementById("navMenu").style.display = "none";
    document.getElementById("menuOverlay").style.display = "none";
    document.getElementById("menuBtn").textContent = "≡";
});
</script>
