<script>
// 前回のスクロール位置を記録する変数
let lastScroll = 0;

// スクロールしたときに動く処理
window.addEventListener("scroll", function() {
    let currentScroll = window.pageYOffset; // 今のスクロール位置

    if (currentScroll > lastScroll) {
        // 下スクロール → ヘッダーを隠す
        document.getElementById("headerLeft").classList.add("hide");
        document.getElementById("headerRight").classList.add("hide");
    } else {
        // 上スクロール → ヘッダーを表示
        document.getElementById("headerLeft").classList.remove("hide");
        document.getElementById("headerRight").classList.remove("hide");
    }

    lastScroll = currentScroll; // 今の位置を記録
});

// MENUボタンを押したときの処理
document.getElementById("menuBtn").addEventListener("click", function() {
    const menu = document.getElementById("navMenu");

    // 表示・非表示を切り替える
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
});
</script>
